name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      # The android/ folder is generated here, so the repo stays small.
      - name: Create Android project files
        run: |
          flutter create --platforms=android --org com.raj3shj --project-name sudoku_app .
          # flutter create adds a sample test for its counter app; ours lives in game_test.dart.
          rm -f test/widget_test.dart
          # Firebase needs Android 7.0 (API 24) or newer.
          sed -i -E 's/minSdk\s*=\s*[^\n]+/minSdk = 24/' android/app/build.gradle.kts
          grep -n "minSdk" android/app/build.gradle.kts

      - name: Install packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # Browser preview of the game. The built files are pushed to the
  # web-build branch so they can be hosted anywhere.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        run: |
          flutter create --platforms=web --org com.raj3shj --project-name sudoku_app .
          rm -f test/widget_test.dart
          flutter pub get
          # Bundle CanvasKit and fonts locally: no CDN downloads at runtime.
          flutter build web --release --no-web-resources-cdn
          # Load files relative to wherever the page is hosted.
          sed -i 's#<base href="/">##' build/web/index.html
          ls -la build/web

      - name: Publish to web-build branch
        run: |
          cd build/web
          git init -q -b web-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" web-build
