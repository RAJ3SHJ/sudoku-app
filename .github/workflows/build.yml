name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      # The android/ folder is generated here, so the repo stays small.
      - name: Create Android project files
        run: |
          flutter create --platforms=android --org com.raj3shj --project-name sudoku_app .
          # flutter create adds a sample test for its counter app; ours lives in game_test.dart.
          rm -f test/widget_test.dart
          # Firebase needs Android 7.0 (API 24) or newer.
          sed -i -E 's/minSdk\s*=\s*[^\n]+/minSdk = 24/' android/app/build.gradle.kts
          grep -n "minSdk" android/app/build.gradle.kts

      - name: Install packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
