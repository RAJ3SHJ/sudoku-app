name: sudoku_app
description: Classic Sudoku with 100 levels across four difficulties.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled so the app never has to download fonts (works offline and on web).
  fonts:
    - family: AppSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
    - family: AppSerif
      fonts:
        - asset: assets/fonts/DejaVuSerif.ttf
        - asset: assets/fonts/DejaVuSerif-Bold.ttf
          weight: 700
